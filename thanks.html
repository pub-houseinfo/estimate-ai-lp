<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>お申し込みありがとうございます｜見積AIエージェント講座｜ハウスインフォ</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Noto+Sans+JP:wght@400;500;700&family=Oswald:wght@500&display=swap" rel="stylesheet">
<style>
:root{ --ink:#1A1A1A; --body:#2B2B2B; --muted:#6E6A63; --hairline:#E5E2DC; --washi:#F5F4F1; --white:#FFFFFF; --clay:#8A6E52;
  --caps:'Oswald','Helvetica Neue',sans-serif; --latin:'Inter','Noto Sans JP',sans-serif; --jp:'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif; }
*{ box-sizing:border-box; }
body{ margin:0; min-height:100svh; display:flex; flex-direction:column; background:var(--washi); color:var(--body); font-family:var(--jp); font-size:17px; line-height:1.9; letter-spacing:.02em; -webkit-font-smoothing:antialiased; }
@media (min-width:768px){ body{ font-size:18px; } }
a{ color:inherit; text-decoration:none; }
p{ margin:0; }
main{ flex:1; display:flex; align-items:center; }
.wrap{ width:100%; max-width:720px; margin:0 auto; padding:96px 24px; }
@media (min-width:768px){ .wrap{ padding:140px 40px; } }
.eyebrow{ font-family:var(--latin); font-size:12px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--clay); margin:0 0 24px; }
h1{ margin:0 0 32px; font-family:var(--jp); font-weight:700; font-size:28px; line-height:1.45; letter-spacing:.04em; color:var(--ink); }
@media (min-width:768px){ h1{ font-size:40px; line-height:1.4; } }
.lines{ display:grid; gap:.6em; }
.back{ display:inline-block; margin-top:48px; font-size:14px; letter-spacing:.06em; color:var(--ink); border-bottom:1px solid var(--hairline); padding-bottom:4px; }
.back:hover{ border-color:var(--clay); }
footer{ padding:40px 24px; font-size:12px; color:var(--muted); letter-spacing:.03em; }
footer .wordmark{ font-family:var(--caps); font-weight:500; font-size:18px; letter-spacing:.18em; color:var(--ink); line-height:1; margin-bottom:8px; }
</style>
</head>
<body>
<main>
  <div class="wrap">
    <p class="eyebrow">Thank you</p>
    <h1>お申し込みを受け付けました。</h1>
    <div class="lines">
      <p>2営業日以内に、こちらからお電話またはメールでご連絡し、日時を調整します。</p>
      <p>当日は、過去の見積を3件ほどお手元にご用意ください。今かかっている時間を、その場で一緒に測ります。</p>
    </div>
    <a class="back" href="./">ページへ戻る</a>
  </div>
</main>
<footer>
  <p class="wordmark">HOUSEINFO</p>
  <p>株式会社ハウスインフォ｜兵庫県姫路市</p>
</footer>
</body>
</html>
