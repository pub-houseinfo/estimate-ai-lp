<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Noto+Sans+JP:wght@400;500&family=Oswald:wght@500;600&family=Zen+Kaku+Gothic+New:wght@900&display=swap" rel="stylesheet">
<style>
  :root{
    --dark:#1F1D1A; --on-dark:#F5F4F1; --muted-dark:#B9B3A8;
    --clay-dark:#C7A987; --bengara-dark:#CE6B45;
    --caps:'Oswald',sans-serif; --jp:'Noto Sans JP',sans-serif;
    --heavy:'Zen Kaku Gothic New','Noto Sans JP',sans-serif; --latin:'Inter',sans-serif;
  }
  html,body{margin:0;padding:0;} *{box-sizing:border-box;}
  .og{width:1200px;height:630px;position:relative;overflow:hidden;background:var(--dark);color:var(--on-dark);
      display:flex;flex-direction:column;justify-content:space-between;padding:52px 72px 48px;font-family:var(--jp);}
  .bg{position:absolute;left:56px;bottom:70px;font-family:var(--caps);font-weight:600;text-transform:uppercase;
      line-height:.88;letter-spacing:.01em;font-size:200px;white-space:nowrap;color:#2B2822;pointer-events:none;}
  .eyebrow{position:relative;z-index:2;font-family:var(--latin);font-size:19px;font-weight:600;letter-spacing:.14em;
           text-transform:uppercase;color:var(--clay-dark);display:flex;align-items:center;gap:16px;}
  .eyebrow .jp{font-family:var(--jp);font-weight:500;letter-spacing:.08em;text-transform:none;font-size:19px;}
  .eyebrow .sep{width:1px;height:19px;background:var(--clay-dark);opacity:.6;}
  .mid{position:relative;z-index:2;}
  h1{margin:0;font-family:var(--heavy);font-weight:900;font-size:68px;line-height:1.3;letter-spacing:.02em;}
  h1 .em{color:var(--bengara-dark);}
  .sub{margin-top:22px;font-size:23px;line-height:1.65;letter-spacing:.03em;color:var(--muted-dark);}
  .foot{position:relative;z-index:2;display:flex;align-items:flex-end;justify-content:space-between;}
  .note{font-size:21px;letter-spacing:.04em;color:var(--muted-dark);}
  .logo{font-family:var(--caps);font-weight:500;font-size:34px;letter-spacing:.06em;line-height:1;text-align:right;}
  .co{font-size:14px;letter-spacing:.08em;color:var(--muted-dark);margin-top:7px;text-align:right;}
</style></head>
<body>
<div class="og">
  <div class="bg">SAME<br>DAY</div>
  <div class="eyebrow"><span>Estimate AI Agent</span><span class="sep"></span><span class="jp">兵庫県の工務店・サブコン向け</span></div>
  <div class="mid">
    <h1>初回の見積提出を、<br><span class="em">その日</span>のうちに。</h1>
    <div class="sub">答えるAIではなく、作るAIを。<br>見積を作れる人を自社に育てる12時間の講座。</div>
  </div>
  <div class="foot">
    <div class="note">まずは30分の無料相談から</div>
    <div><div class="logo">HOUSEINFO</div><div class="co">株式会社ハウスインフォ</div></div>
  </div>
</div>
</body></html>
